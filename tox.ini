[tox]
envlist = py{311,312}-django{42,52}, quality, docs
requires = tox-uv>=1

[doc8]
; D001 = Line too long
ignore=D001

[pycodestyle]
exclude = .git,.tox
max-line-length = 120
max-doc-length = 120

[pytest]
DJANGO_SETTINGS_MODULE = test_utils.test_settings
addopts = --cov openedx_filters --cov-report term-missing --cov-report xml
norecursedirs = .* docs site-packages

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
setenv =
    DJANGO_SETTINGS_MODULE = test_utils.test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/openedx_filters.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
    make
commands =
    make quality
