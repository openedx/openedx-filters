[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-filters"
description = "Open edX Filters from Hooks Extensions Framework (OEP-50)."
readme = "README.rst"
license = "AGPL-3.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "eduNEXT", email = "technical@edunext.co"},
]
keywords = ["Python", "openedx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "django>=4.2,<6.0",
    "edx-opaque-keys[django]",
    "setuptools",
]

[project.urls]
Homepage = "https://github.com/openedx/openedx-filters"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools]
include-package-data = true
zip-safe = false
# Package lives in src/ but is installed without the src prefix,
# e.g. src/openedx_filters/ is installed as openedx_filters.
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openedx_filters*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.uv]
package = true
# Every group that (transitively, via include-group) pulls in the default
# Django pin from `test` must be declared here explicitly opposite
# `django42` -- uv derives these transitively but its lockfile serialization
# order for derived pairs is not stable across `uv lock` runs, which trips
# up tox-uv-bare's `uv sync --locked` check. Listing them all explicitly
# keeps `uv.lock` deterministic. Update this list if `doc`/`quality`/`dev`
# stop including `test`, or if a new group starts including it.
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
    [
        {group = "doc"},
        {group = "django42"},
    ],
    [
        {group = "quality"},
        {group = "django42"},
    ],
    [
        {group = "dev"},
        {group = "django42"},
    ],
]

#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "uv==0.11.32",
]

[tool.edx_lint]
# uv (pulled in transitively by tox-uv/tox-uv-bare, used internally by the
# uv-venv-lock-runner tox envs) is pinned to an exact version here so that the
# `uv` binary tox-uv installs into each per-env venv always agrees with the
# `uv.lock` file's own conflicts/resolution bookkeeping, regardless of which
# uv release happens to be on PATH (e.g. via astral-sh/setup-uv in CI, or a
# developer's local uv). Different uv releases have disagreed on how
# [tool.uv].conflicts entries get recorded in the lockfile, which otherwise
# trips up tox-uv-bare's `uv sync --locked` check. When bumping this, also
# bump the `version:` pin on the `astral-sh/setup-uv` step in
# .github/workflows/ci.yml to match.
uv_constraints = ["uv==0.11.32"]

[dependency-groups]
# Base test packages, no Django version pinned.
test-base = [
    "code-annotations",
    "ddt",
    "django-stubs",
    "mypy",
    "pytest-cov",
    "pytest-django",
]
# Default test group: current supported Django version.
# Update the Django pin here when bumping the default; django42 below
# covers the older supported version.
test = [
    {include-group = "test-base"},
    "django>=5.2,<5.3",
]
# Legacy Django 4.2 support.
django42 = [
    {include-group = "test-base"},
    "django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "build",
    "edx-lint",
    "isort",
    "mypy",
    "pycodestyle",
    "ruff",
    "twine",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "twine",
]
# Minimal CI group: just what's needed to invoke tox.
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    {include-group = "doc"},
    "diff-cover",
    "scriv",
]

[tool.coverage.run]
branch = true
source = ["openedx_filters"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.isort]
include_trailing_comma = true
indent = "    "
line_length = 120
multi_line_output = 3

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = ".. changelog-insertion-marker"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.rst"
output_format = "rst"
