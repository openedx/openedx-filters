name: Python CI

on:
  workflow_call:
  pull_request:
    branches:
    - '**'


jobs:
  run_tests:
    name: ${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        toxenv: ["django42", "django52", "quality", "docs"]
        # [TEMP] include 3.11 tests until most operators developing filters have migrated to Verawood/Python 3.12.
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            toxenv: "py311-django42"
          - os: ubuntu-latest
            python-version: '3.11'
            toxenv: "py311-django52"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
        # Pinned to match the `uv` package version locked in uv.lock (a
        # transitive dependency of tox-uv/tox-uv-bare). Keep this in sync
        # whenever `make upgrade` changes that pinned version, otherwise
        # tox-uv's internal `--locked` check can disagree with this
        # workflow's own `uv sync`/`uv run` calls.
        version: "0.11.32"

    - name: Install CI dependencies
      run: uv sync --group ci

    - name: Run Tests
      run: uv run tox -e ${{ matrix.toxenv }}

    - name: Run coverage
      if: matrix.python-version == '3.12' && matrix.toxenv == 'django42'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
