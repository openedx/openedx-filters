name: Python CI

on:
  workflow_call:
  pull_request:
    branches:
    - '**'


jobs:
  run_tests:
    name: tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        toxenv: ["django42", "django52", "quality", "docs"]
        # [TEMP] include 3.11 tests until most operators developing filters have migrated to Verawood/Python 3.12.
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            toxenv: "py311-django42"
          - os: ubuntu-latest
            python-version: '3.11'
            toxenv: "py311-django52"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install CI dependencies
      run: uv sync --locked --group ci

    - name: Run Tests
      run: uv run --locked tox -e ${{ matrix.toxenv }}

    - name: Run coverage
      if: matrix.python-version == '3.12' && matrix.toxenv == 'django42'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
